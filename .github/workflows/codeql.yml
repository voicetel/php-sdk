name: CodeQL

# CodeQL does not ship a first-party PHP language pack
# (https://docs.github.com/en/code-security/code-scanning/...).
# We still get real value from scanning the workflow files themselves —
# environment-injection bugs, unsafe action-version pinning, etc. —
# via the `actions` language pack. PHP source SAST is covered
# separately by phpstan-and-friends in ci.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 6 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language: [actions]

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
